# dsh-connect-agnes-token-plan — the bundle's own patch layer.
#
# Reads the Agnes Token Plan quota through the console API and shows it in
# a config card on the Plugins page (`plugins.bundle.config` slot) — not in the
# sidebar. Everything below is plain configuration: edit it here (or
# override the same id in the profile's cordis.patch.yml) and reinstall/reload.
#
# The console token is NOT configured here. Open the panel and sign in once:
# the Host logs in, keeps the account in the DSH credentials, and re-logs in
# on its own when the token dies (Agnes issues no refresh token). See README.md.
- insert:
    - id: dsh-connect-agnes-token-plan
      name: dsh-connect-agnes-token-plan
      config:
        # Console origin (the BACKEND host, not the console front-end: the
        # front-end origin serves /api/* as a Next.js 404 shell). Override if
        # you use a mirror or proxy.
        consoleBase: https://platform-backend.agnes-ai.cn
        # The OpenAI-compatible API base, used only for the optional model
        # catalog (which models this key can call). Leave it alone unless the
        # platform moves the endpoint.
        apiBase: https://api.agnes-ai.cn/v1
        # How many days of usage the chart covers (max 365). Days, not hours:
        # the console's series endpoint takes start_date / end_date as DATES.
        usageDays: 30
        # Pseudo multipliers for the model roster: keys are case-insensitive
        # SUBSTRINGS of a model id (first match in writing order wins), values
        # are positive numbers. Empty by default — the factor used to scale a
        # per-model credit figure, and Agnes publishes no per-model usage at
        # all. What is left is your own annotation: a `×N` badge on a roster
        # row. Rows without a match get no badge, never a guessed 1.
        # Invalid entries (empty key / value <= 0 / non-number) are dropped.
        trendMultipliers: {}
        # How long the Host caches each console response, in seconds.
        cacheSeconds: 60
        # How often the panel asks the Host again, in seconds. The Host states
        # this to the bundle on every snapshot, so the two cannot disagree about
        # how fresh the screen is.
        pollSeconds: 30
        # Deadline for one console call, in milliseconds. The login flow has its
        # own (loginTimeoutMs, below) because it carries a password and may be
        # rate-limited, so the two are not the same number.
        consoleTimeoutMs: 15000
        # Renew the console token this many seconds before it actually expires,
        # so a poll never races the expiry boundary. 120 = two minutes.
        tokenSkewSeconds: 120
        # Extra host names this Host answers as, beyond the loopback defaults
        # (localhost / 127.0.0.1 / ::1). ADDED to them, never substituted — see
        # docs/SETUP.md. Uncomment and list to serve the panel from another name.
        # allowedHosts: []
        # The login flow's overrides. Everything below is optional: a key left
        # commented keeps the platform default. Agnes signs in with ONE request
        # (POST {consoleBase}/api/user/login), so there is no OIDC walk and none
        # of the SenseNova endpoint knobs exist here any more.
        # loginPath: /api/user/login
        #   -> the sign-in path, if the platform ever moves it.
        # fallbackExpiresInSeconds: 604800
        #   -> lifetime assumed when the access token is not a readable JWT
        #      (7 days by default). Deliberately LONG: a token assumed dead
        #      while still alive spends a real sign-in on every poll, and Agnes
        #      locks an account after a few bad attempts.
        # loginTimeoutMs: 20000
        #   -> deadline for one sign-in attempt, in ms. requestTimeoutMs is its
        #      older spelling and still wins when only it is set; the console
        #      calls use consoleTimeoutMs above.
        # requestTimeoutMs: 20000
        # ------------------------------------------------------------------
        # Vision step two: publish which of this key's models accept image
        # input into this row's OWN settings namespace, for a later LLM
        # connect plugin to read. It writes only its own row - never another
        # provider's imageModelIds - so a miscalculated model list can only
        # affect the panel, not DSH's model routing.
        #
        # `writeImageModelIds: true`  -> the Host syncs visionModels into
        #   `imageModelIds` on this row's settings on every catalog poll
        #   (opt-in, off by default; the panel's read-only info layer is the
        #   safe shape).
        # `imageModelIds: []`         -> the last written model-id list.
        # `visionModels: []`          -> the last full vision identification
        #   (ids + source markers), kept for a reader that wants the detail.
        writeImageModelIds: false
        imageModelIds: []
        visionModels: []
        # ------------------------------------------------------------------
        # Step three ("one-stop service"): register the Agnes LLM
        # provider DIRECTLY, with no hand-written llm-pi-ai row. When true
        # the Host offers an OpenAI-compatible provider
        # (`agnes-token-plan`, base apiBase above): the panel's API-key
        # field stores the `sk-` key in the DSH credentials (the process
        # environment still works as a fallback), the catalog poll builds
        # the model list, and vision models accept image input
        # automatically. The cached catalog and the model allow-list live
        # in this plugin's own state file, never on this row. Off by
        # default - registering a model source is a Host-wide change.
        # This value is now the DEPLOYMENT DEFAULT only: the panel's
        #「模型接入」switch (POST /api/<name>/provider) overrides it live,
        # with no restart. See docs/PROVIDER-HOT-RELOAD.md.
        registerProvider: false
        # ------------------------------------------------------------------
        # Draw absorption (docs/ARCHITECTURE.md §5.4, route B): when true AND
        # the Host exposes a tools service, the agent gains an
        # `agnes_draw_image` tool that POSTs to
        # `{apiBase}/images/generations` with the panel-saved
        # `AGNES_TOKEN_PLAN_API_KEY`. Draw models are identified by the
        # catalog's own `output_modalities` when the platform declares it and
        # by an `image` segment in the model id when it does not - the Agnes
        # gateway declares NO modality field at all (docs/AGNES-API.md §7.1),
        # so the name fallback is the path that actually fires here. The key is
        # resolved per call, and a failed draw starts a 30s cooldown. Off by
        # default - an agent tool is a Host-wide change; a Host without the
        # tools service simply never sees it.
        # drawEnabled: false
        #   -> the opt-in switch (strict boolean).
        # drawModelId: ""
        #   -> preferred image model id; empty = first of the catalog
        #      (e.g. Agnes-u1-fast).
        # drawTimeoutMs: 120000
        #   -> deadline for one image request (image models are slow).
        # ------------------------------------------------------------------
        # ------------------------------------------------------------------
        # Video absorption (docs/AGNES-API.md §7.5): the same ladder as draw,
        # with one protocol difference that decides the shape - video is an
        # ASYNCHRONOUS TASK, so the tool creates a task and polls it. Off by
        # default, like the draw tool.
        # videoEnabled: false
        #   -> the opt-in switch (strict boolean).
        # videoModelId: ""
        #   -> preferred video model id; empty = first V2.0-family model in the
        #      catalog. The 2.5 family (`agnes-video-2.5`, `-2.5-flash`) is
        #      NOT selectable: it takes `mode`/`seconds`/`size`/`aspect_ratio`
        #      instead of `width`/`height`/`num_frames`/`frame_rate`, and
        #      mixing the two schemas is a 400. The panel names the excluded
        #      models so their absence is explained rather than mysterious.
        # videoTimeoutMs: 600000
        #   -> deadline for the WHOLE task (create + poll). Minutes, not
        #      seconds; floor 30000.
        # videoWidth: 1152
        # videoHeight: 768
        #   -> the V2.0 frame size. Passed straight through.
        # videoNumFrames: 121
        #   -> frame count; must be <= 441 AND satisfy 8n+1 (81 / 121 / 161 /
        #      241 / 441). 121 @ 24fps is about 5 seconds. An illegal explicit
        #      value is REFUSED, not clamped: silently shortening a clip the
        #      caller asked for is worse than an error they can read.
        # videoFrameRate: 24
        #   -> frames per second, 1-60.
        # ------------------------------------------------------------------
