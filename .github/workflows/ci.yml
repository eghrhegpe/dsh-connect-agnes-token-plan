name: CI

# Five tiers, on purpose.
#
#   offline      — the full offline suite list (see package.json's `test` script,
#                  plus the build-gate tail: a real tsdown build of src/ into
#                  lib/ + client.js). The *.test.mjs roster is pinned three ways
#                  by test/package.test.mjs: disk ↔ `test` script ↔ this job, so a
#                  suite that is written but not gated, or gated but not run here,
#                  goes red instead of rotting silently. The gate file itself is
#                  not a *.test.mjs (same exemption as e2e-gate) and is listed
#                  explicitly below.
#                  These are the real gate: they stub the network
#                  (test/peer-roots.mjs installs a sentinel that fails any
#                  request escaping a stub), so a red here is always a regression.
#   e2e          — boots a REAL `dsh web` process against a fake platform. It proves
#                  the loader, routes, and trust fence assemble correctly — the class
#                  of bug the offline suites cannot see. It needs the dsh CLI and a
#                  host that can bind loopback ports, which a generic runner may not
#                  provide. It always runs through test/e2e-gate.mjs, never the bare
#                  suite: the gate prints a loud SKIP and exits 0 when the CLI is
#                  absent, so an unsupported runner does not fail the build — but when
#                  the CLI IS present the suite really runs and a red really blocks.
#                  The bare e2e.mjs carries no CLI check of its own, so running it
#                  directly in CI (as this job once did) turned the gate into a
#                  formality that nobody noticed.
#   live-contract— replays the frozen Agnes inference contract against the LIVE
#                  platform (`test/live-contract.mjs`), so a platform dialect drift
#                  (a renamed field, a flipped 400, a new modality spelling) shows
#                  red the day it happens instead of on the next manual run. Needs
#                  the `AGNES_TOKEN_PLAN_API_KEY` repo secret (owner-injected, never
#                  in the code); without it the suite SKIPs loudly and exits 0 —
#                  the same shape as e2e's missing-dsh-CLI skip. Red here is
#                  INFORMATION, not a regression (the fix belongs in the comment
#                  layer, docs/AGNES-API.md §7), which is why it is best-effort
#                  too and never gates the offline job.
#   artifacts    — rebuilds src/ and proves the COMMITTED lib/ + client.js equal
#                  a fresh rebuild (`git diff --exit-code` after the build; a
#                  second build must change nothing — reproducible: chunk names
#                  are `[name].js`, not content hashes). Since the artifacts are
#                  tracked in git (a git/marketplace install clones them ready to
#                  load — pnpm refuses to run build scripts for git dependencies,
#                  `ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED`, and the `allowBuilds`
#                  allowlist is not an install-time knob), this is the fence that
#                  keeps a "src changed but nobody rebuilt + committed" commit
#                  from shipping a stale plugin to every git-install user.
#   dpapi        — the ONE leg the offline suites cannot reach by injection: the
#                  production DPAPI unwrap, a real PowerShell child process. It is
#                  Windows-only by nature (the implementation maps every other
#                  platform to UNSUPPORTED_PLATFORM), so on the ubuntu matrix the
#                  suite prints SKIP and exits 0 — listed in the roster, asserting
#                  nothing. This job is the only place those five assertions
#                  actually execute.
#                  It installs NOTHING: `src/host/agnescode.ts` imports only
#                  `node:crypto` and two local modules, so the job is checkout +
#                  node + one file. That is what makes it affordable — a full
#                  Windows suite here would pay for `npm install -g
#                  @deepseek-ai/dsh`, which measured 773 s on windows-latest in
#                  the sibling qoder repo (run 39277257312) against 41 s on
#                  ubuntu.
#
# The e2e suite runs through the SAME test/e2e-gate.mjs locally (`npm test`) and
# here, so both share one skip shape and one verdict. A suite that passes only in
# one of the two is not a gate.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline suites (hard gate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # No lockfile by design (the peerDependencies cannot resolve from any
          # registry), so the npm cache keys off package.json instead.
          cache: npm
          cache-dependency-path: package.json
      # The offline suites themselves still run on bare node (they import the
      # src/*.ts sources directly via native type stripping and resolve peers
      # from stubs). The install exists for ONE suite: build-gate, which runs
      # the real tsdown build. --legacy-peer-deps is mandatory — the plugin's
      # peerDependencies are Host-runtime packages that no registry serves.
      - name: Install dev dependencies (tsdown, for the build gate)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      # store / routes / wiring load the REAL peer packages (`@deepseek-ai/dsh-*`),
      # which ship inside the DSH runtime and are on no registry. A runner has no
      # `~/.dsh` unpacked runtime, so without this step `test/peer-roots.mjs`
      # throws at the SECOND suite and the other 20 never run — which is exactly
      # how this job was red on every push from 2026-09-30 to 2026-10-01
      # (docs/PITFALLS.md §32). The globally installed CLI carries the
      # version-matched tree, and `peer-roots.mjs` falls back to it via
      # `npm root -g`.
      #
      # That install measured 33-41 s on ubuntu-latest (against 773 s on
      # windows-latest, run 39277257312 in the sibling qoder repo), and it
      # unpacks the SAME tree every run: the CLI's version comes from the
      # registry's `latest` tag, not from this repo. So the three steps below
      # give npm's global prefix a cacheable home and let actions/cache carry
      # the unpacked runtime between runs; the install then only happens on a
      # cache miss. Keyed on the resolved version, so a new CLI release misses
      # by construction instead of restoring a stale tree under a `dsh-base`
      # that no longer matches.
      #
      # NPM_CONFIG_PREFIX goes through `$GITHUB_ENV` rather than an `.npmrc`
      # because the environment variable outranks the config file (the reason
      # the qoder workflow had to switch to it).
      #
      # `$PREFIX/bin` goes onto PATH as well, and that part is NOT optional
      # here: `test/e2e-gate.mjs` only counts the CLI as present when BOTH
      # `dsh --version` runs AND `npm root -g` resolves a tree carrying
      # `@deepseek-ai/dsh-base`. Moving the prefix without moving the shim
      # splits exactly those two — the gate's own "usual cause" line — and the
      # e2e job would silently degrade from a hard gate to a SKIP.
      - name: Point npm's global prefix at a cacheable directory
        run: |
          PREFIX="$RUNNER_TEMP/dsh-global"
          # Created up front so a cache miss does not end with actions/cache
          # warning that the save path never existed.
          mkdir -p "$PREFIX/bin"
          echo "NPM_CONFIG_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Resolve the host version the peers load
        id: dsh-version
        run: echo "version=$(npm view @deepseek-ai/dsh version)" >> "$GITHUB_OUTPUT"

      # restore/save are split rather than the combined `actions/cache`: the
      # combined action saves whatever the path holds at job teardown, so a run
      # whose install FAILED would persist an empty directory under this key
      # and every later run for the same CLI version would restore it forever
      # (a saved key is never overwritten). Saving only when the anchor below
      # was actually found keeps a bad run from poisoning the key.
      - name: Restore the cached DSH runtime
        id: dsh-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: dsh-runtime-${{ runner.os }}-node${{ matrix.node-version }}-${{ steps.dsh-version.outputs.version }}

      # The guard asks the question the suites actually ask — does the anchor
      # `peer-roots.mjs` checks exist — instead of trusting `cache-hit`. A
      # restored-but-truncated tree would report a hit and then fail every peer
      # suite for a reason that looks like a code regression.
      - name: Provide the DSH runtime (the peers store / routes / wiring load)
        id: dsh-runtime
        run: |
          echo "npm root -g -> $(npm root -g)"
          ANCHOR="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-base"
          if node -e "process.exit(require('node:fs').existsSync(process.argv[1]) ? 0 : 1)" "$ANCHOR"; then
            echo "cached runtime already present: $ANCHOR"
          else
            npm install -g @deepseek-ai/dsh || echo "dsh CLI not installable here; the peer suites will name the missing package"
          fi
          # Only this decides whether the cache is written: an anchor still
          # missing after the install means there is nothing worth saving.
          if node -e "process.exit(require('node:fs').existsSync(process.argv[1]) ? 0 : 1)" "$ANCHOR"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the runtime anchor is still missing after install; the cache will not be saved"
          fi

      - name: Save the DSH runtime for the next run
        if: steps.dsh-cache.outputs.cache-hit != 'true' && steps.dsh-runtime.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: ${{ steps.dsh-cache.outputs.cache-primary-key }}
      - name: Run the offline suites
        run: |
          set -e
          node test/agnes-auth.test.mjs
          node test/credential-guard.test.mjs
          node test/redaction-closure.test.mjs
          node test/store.test.mjs
          node test/store-baseline.test.mjs
          node test/routes.test.mjs
          node test/catalog-refresh.test.mjs
          node test/panel.test.mjs
          node test/cards.test.mjs
          node test/render.test.mjs
          # The real-DOM mount suite: the SHIPPED client.js + real react +
          # react-dom into jsdom, driven through clicks/typing/submits. Needs
          # the devDependencies installed above (jsdom/react/react-dom); on a
          # clean checkout without them it SKIPs loudly, but this job installs
          # them, so here it really gates — it is the only suite where hook
          # components (AccountForm, ModelPicker) actually mount.
          node test/dom-render.test.mjs
          node test/parsers.test.mjs
          node test/provider.test.mjs
          node test/config.test.mjs
          node test/package.test.mjs
          node test/docs.test.mjs
          # The market-entry gate: the submission copy under
          # awesome-dsh-plugin-submission/ is read with the SAME js-yaml the
          # marketplace parses it with, then checked against a mirror of the
          # market's entry rules (unknown key, url shape, name vs url, category
          # out of the 22 allowed, missing description.en, a locale the site
          # does not render). Those are rejections at review time — invisible
          # here until they are. js-yaml is a devDependency (installed above),
          # so this really runs in this job instead of taking a SKIP path.
          node test/market-entry.test.mjs
          node test/wiring.test.mjs
          node test/contract.test.mjs
          node test/retry.test.mjs
          node test/error-fix.test.mjs
          node test/peer-contract.test.mjs
          node test/draw.test.mjs
          node test/video.test.mjs
          node test/doctor.test.mjs
          node test/switch-store.test.mjs
          node test/switch-precedence.test.mjs
          node test/admission-audit.test.mjs
          node test/agnescode.test.mjs
          node test/agnescode-dpapi.test.mjs
          node test/agnescode-stats.test.mjs
          node test/agnescode-ledger.test.mjs
          node test/agnescode-login.test.mjs
          node test/publish-core.test.mjs
          node test/state-authority.test.mjs
          node test/platform-assumptions.test.mjs
          node test/state-store.test.mjs
          # The peer RANGE gate: what the 10 `>=0.1.5 <0.3` declarations do to
          # the real published version list, frozen in test/host-range.golden.json.
          # Offline (it reads the committed golden, never the registry), so it runs
          # in this job; `--check` then proves the golden still matches the manifest.
          node test/host-range.test.mjs
          node tools/update-host-range.mjs --check
          # The build gate is not a *.test.mjs, so it stays outside the
          # three-way roster pin; it is listed here because CI is exactly
          # where the build must be proven. The artifacts are committed with
          # the repo, so a fresh checkout already loads; this rebuild proves
          # the current src/ still builds (the artifacts job below pins the
          # committed artifacts to that rebuild).
          node test/build-gate.mjs
          # The type gate: i18n's `en: typeof zh`, the wire.ts mirror and the
          # strict tsconfig flags are compile-time fences, so they need a
          # compile step in the gate. Same exemption from the roster pin as
          # build-gate. `typescript` is a devDependency (installed above), so
          # this really runs here instead of taking its SKIP path.
          node test/tsc-gate.mjs
          # The duplication gate (jscpd): a positive regression fence — src/ must
          # stay below the measured draw/video-isomorphism baseline, so a NEW
          # large copy fails the build. Same non-roster exemption as build-gate
          # / tsc-gate; SKIPs loudly when jscpd is absent.
          node test/dup-gate.mjs
          # The composer pill's PEER contract: the DSH client still declares the
          # `conversation.input.right` seat, still renders it, still exposes the
          # session `projection` keyed hook and still materializes `useProjection`
          # strictly. Static reads of the runtime this job installed; SKIPs loudly
          # when the machine has no DSH client copy.
          node test/composer-slot-gate.mjs
          # The `any` budget: the ledger for tsconfig's `noImplicitAny: false`.
          # No tool, no runtime, no key — it counts the shipped source only, so
          # unlike the gates above it has no environment it cannot run in and
          # therefore no SKIP branch. Regenerate with UPDATE_BASELINE=1.
          node test/any-budget-gate.mjs

  dpapi:
    name: DPAPI round-trip (hard gate, Windows only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Why a job for one file: `agnescode-dpapi.test.mjs` is in the offline
      # roster above, so the three-way pin in test/package.test.mjs is satisfied
      # and the job is green — but on ubuntu the suite takes its SKIP branch and
      # executes zero assertions. The capability it covers is the one this plugin
      # advertises as Windows-only: unwrapping the AgnesCode desktop session's
      # os_crypt key through the CurrentUser DPAPI key, i.e. the harvest leg that
      # regresses silently (a PowerShell quoting slip surfaces only as "no session
      # on this machine").
      #
      # No `npm install`, no host runtime, no cache step: see the `dpapi` tier in
      # the header. Failing assertions set `process.exitCode = 1`, so this gates
      # rather than reports.
      - name: Real DPAPI round-trip (PowerShell Protect → defaultDpapiUnprotect)
        run: node test/agnescode-dpapi.test.mjs

  artifacts:
    name: Committed artifacts in sync with src/ (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # No lockfile by design (the peerDependencies cannot resolve from any
          # registry), so the npm cache keys off package.json instead.
          cache: npm
          cache-dependency-path: package.json
      # tsdown for the rebuild; --legacy-peer-deps because the peerDependencies
      # are Host-runtime packages that no registry serves (same shape as the
      # offline job's install).
      - name: Install dev dependencies (tsdown, for the rebuild)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      # lib/ and the root client.js are TRACKED in git: a git/marketplace install
      # clones them ready to load — pnpm refuses to run build scripts for git
      # dependencies (`ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED`), and the
      # `allowBuilds` allowlist is not an install-time knob. So "src changed but
      # nobody rebuilt + committed" would ship a stale plugin to every
      # git-install user; this gate is the fence. A second build must change
      # nothing — the artifacts are reproducible (chunk names are `[name].js`,
      # not content hashes: same src in, byte-identical out).
      - name: Freshness gate — committed artifacts equal a rebuild of src/
        run: |
          set -e
          npm run build
          git diff --exit-code -- lib client.js
          npm run build
          git diff --exit-code -- lib client.js

  e2e:
    name: End-to-end (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The e2e harness spawns `dsh web`; without the CLI the gate prints SKIP
      # and exits 0, so a runner without it stays green — but a runner WITH it
      # really runs the suite and a red fails the job. Install the CLI when a
      # registry source is configured; when it is not, let the gate skip rather
      # than failing the build on an environment the suite cannot support.
      #
      # Same cached prefix as the offline job (see the long note there), but
      # the guard differs by one clause: here the `dsh` SHIM is load-bearing,
      # because this is the job that actually spawns it. So a cache hit only
      # counts when the anchor exists AND `dsh --version` runs — otherwise the
      # cache restore would have "succeeded" while handing the gate the exact
      # split-prefix condition it skips on.
      - name: Point npm's global prefix at a cacheable directory
        run: |
          PREFIX="$RUNNER_TEMP/dsh-global"
          mkdir -p "$PREFIX/bin"
          echo "NPM_CONFIG_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Resolve the host version this job boots
        id: dsh-version
        run: echo "version=$(npm view @deepseek-ai/dsh version)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached DSH CLI
        id: dsh-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: dsh-runtime-${{ runner.os }}-node22-${{ steps.dsh-version.outputs.version }}

      - name: Provide the dsh CLI (if available)
        id: dsh-runtime
        run: |
          echo "npm root -g -> $(npm root -g)"
          ANCHOR="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-base"
          have_runtime() { node -e "process.exit(require('node:fs').existsSync(process.argv[1]) ? 0 : 1)" "$ANCHOR"; }
          if have_runtime && dsh --version >/dev/null 2>&1; then
            echo "cached CLI already present and runnable: $(command -v dsh)"
          else
            npm install -g @deepseek-ai/dsh || echo "dsh CLI not installable here; e2e will SKIP"
          fi
          # The cache is written only when the gate would really run: a broken
          # shim or a missing anchor is exactly the SKIP condition, and saving
          # that state would keep the job skipping on every later run.
          if have_runtime && dsh --version >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no runnable dsh CLI after the install; the cache will not be saved and e2e will SKIP"
          fi

      - name: Save the DSH CLI for the next run
        if: steps.dsh-cache.outputs.cache-hit != 'true' && steps.dsh-runtime.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: ${{ steps.dsh-cache.outputs.cache-primary-key }}
      # The Host loads the plugin's BUILT entry (`main: ./lib/index.js`, plus the
      # client `client.js`). Both are committed with the repo, so a fresh
      # checkout already loads — but e2e must exercise the CURRENT src/, not
      # whatever the committed artifacts hold, so this build step stays. On
      # 2026-10-01 a missing build here cascaded 50 of 61 checks from "dsh:
      # warning: 1 entry did not activate" (PITFALLS §32).
      - name: Build the artifacts the Host loads
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      # Run through the GATE, not the bare suite. `e2e.mjs` has no CLI check;
      # `e2e-gate.mjs` does, and it is the only thing that makes the missing-CLI
      # skip safe. package.test.mjs pins this — a gate file present but bypassed
      # is a red.
      - name: Run the end-to-end suite
        shell: bash
        run: |
          set +e
          out=$(node test/e2e-gate.mjs 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          # The gate exits 0 for BOTH "passed" and "skipped", so a green
          # outcome alone never says which. Lift the gate's VERDICT token into
          # the job summary: a green badge that skipped the loader must not read
          # the same as one that exercised it. The token is emitted by
          # test/e2e-gate.mjs, so the two cannot drift apart.
          if printf '%s' "$out" | grep -q 'VERDICT=SKIPPED'; then
            # Two skips share the verdict token (no CLI at all / a CLI whose
            # runtime tree cannot be shared), so the summary quotes the gate's
            # own reason instead of guessing "no dsh CLI" for both.
            reason=$(printf '%s' "$out" | grep -o 'SKIP_REASON=[a-z-]*' | head -1)
            echo "**e2e: SKIPPED** (${reason:-SKIP_REASON=unknown}) - this green job did NOT exercise the loader, routes, or trust fence." >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s' "$out" | grep -q 'VERDICT=PASSED'; then
            echo "**e2e: RAN and PASSED** - a real dsh web process against the fake platform." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**e2e: FAILED** - see the check list above." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

  live-contract:
    name: Live platform contract (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No dependencies to install (peerDependencies only — same as offline).
      # The key comes from the repo secret the owner injects; without it the
      # suite SKIPs loudly and exits 0 (`test/live-contract.mjs` header), the
      # same shape as the e2e gate's missing-dsh-CLI skip. Note this is NOT a
      # `*.test.mjs` line, so it stays out of the three-way roster pin.
      - name: Run the live platform contract
        run: node test/live-contract.mjs
        env:
          AGNES_TOKEN_PLAN_API_KEY: ${{ secrets.AGNES_TOKEN_PLAN_API_KEY }}
